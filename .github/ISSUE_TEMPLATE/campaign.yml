name: Research campaign
description: Define a bounded parent campaign for deterministic parallel task generation.
title: "[campaign] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Research objective and decision supported
    validations:
      required: true
  - type: input
    id: window
    attributes:
      label: UTC campaign window
      placeholder: "2026-08-04T00:00:00Z/2026-08-05T00:00:00Z"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Source groups, regions, topics, and content types
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions and safety constraints
    validations:
      required: true
  - type: input
    id: task_prefix
    attributes:
      label: Task-manifest prefix
      placeholder: tasks/2026/08/04/
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: Planning gate
      options:
        - label: Shards are mutually exclusive
          required: true
        - label: Coverage gaps and unavailable platforms are explicit
          required: true
        - label: Publication and safety review tasks are included
          required: true
