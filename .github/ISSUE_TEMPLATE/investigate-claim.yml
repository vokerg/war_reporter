name: Investigate claim
description: Search supporting, contradicting, upstream, and corrective evidence.
title: "[claim-review] "
labels: ["task:claim-review"]
body:
  - type: input
    id: claim
    attributes:
      label: Claim ID
    validations:
      required: true
  - type: input
    id: window
    attributes:
      label: Research cutoff
      placeholder: "2026-08-04T18:00:00Z"
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Verification questions
      description: Include support, contradiction, common upstream origin, alternatives, and corrections.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed output paths
    validations:
      required: true
  - type: input
    id: idempotency
    attributes:
      label: Idempotency key
    validations:
      required: true
