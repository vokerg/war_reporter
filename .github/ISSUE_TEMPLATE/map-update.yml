name: Map update
description: Convert approved claims into uncertainty-aware map features.
title: "[map-update] "
body:
  - type: input
    id: task_manifest
    attributes:
      label: Task manifest path
      placeholder: tasks/task_map_update_....json
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: Approved claim IDs
      description: One claim ID per line.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Snapshot timestamp
      placeholder: "2026-08-04T18:00:00Z"
    validations:
      required: true
  - type: input
    id: publish_not_before
    attributes:
      label: Earliest publication timestamp
      placeholder: "2026-08-05T18:00:00Z"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Precision, uncertainty, delay, and safety constraints
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed output paths
    validations:
      required: true
  - type: input
    id: idempotency
    attributes:
      label: Idempotency key
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: WGS 84 longitude/latitude order used
          required: true
        - label: Reported presence is not represented as territorial control
          required: true
        - label: Precision and uncertainty method are explicit
          required: true
        - label: Withheld features have null geometry
          required: true
        - label: Human safety review requested where classification is ambiguous
          required: true
