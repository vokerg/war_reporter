name: Report production
description: Produce a daily, weekly, or snapshot report from a frozen approved claim set.
title: "[report] "
body:
  - type: input
    id: task_manifest
    attributes:
      label: Task manifest path
    validations:
      required: true
  - type: dropdown
    id: report_type
    attributes:
      label: Report type
      options:
        - daily
        - weekly
        - snapshot
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: UTC report period
      placeholder: "2026-08-04T00:00:00Z/2026-08-05T00:00:00Z"
    validations:
      required: true
  - type: input
    id: claim_set
    attributes:
      label: Frozen claim-set hash
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Approved claim and assessment IDs
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Required coverage-gap disclosures
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed report and manifest paths
    validations:
      required: true
