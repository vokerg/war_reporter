name: Auto-merge reviewed worker task

on:
  workflow_run:
    workflows: ["Validate repository contracts"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve eligible pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          validated_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$validated_sha" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub can omit workflow_run.pull_requests even for a PR-triggered
          # validation run. Recover only a unique open, non-draft, same-repo PR
          # whose current head exactly matches the validated commit.
          if [ -z "$pr_number" ]; then
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$validated_sha/pulls?per_page=100" \
              > /tmp/pr-candidates.json
            candidate_count="$(jq \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg sha "$validated_sha" \
              '[.[] | select(
                .state == "open" and
                .draft == false and
                .base.ref == "main" and
                .head.repo.full_name == $repo and
                .head.sha == $sha
              )] | length' \
              /tmp/pr-candidates.json)"
            if [ "$candidate_count" -ne 1 ]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number="$(jq -r \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg sha "$validated_sha" \
              '[.[] | select(
                .state == "open" and
                .draft == false and
                .base.ref == "main" and
                .head.repo.full_name == $repo and
                .head.sha == $sha
              )][0].number' \
              /tmp/pr-candidates.json)"
          fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > /tmp/pr.json
          head_ref="$(jq -r '.head.ref' /tmp/pr.json)"
          head_sha="$(jq -r '.head.sha' /tmp/pr.json)"
          base_sha="$(jq -r '.base.sha' /tmp/pr.json)"
          title="$(jq -r '.title' /tmp/pr.json)"
          eligible=true
          [ "$(jq -r '.state' /tmp/pr.json)" = open ] || eligible=false
          [ "$(jq -r '.draft' /tmp/pr.json)" = false ] || eligible=false
          [ "$(jq -r '.base.ref' /tmp/pr.json)" = main ] || eligible=false
          [ "$(jq -r '.head.repo.full_name' /tmp/pr.json)" = "$GITHUB_REPOSITORY" ] || eligible=false
          [ "$head_sha" = "$validated_sha" ] || eligible=false
          [[ "$head_ref" == work/task_* ]] || eligible=false
          [[ "$title" != \[hardening\]* ]] || eligible=false
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "task_id=${head_ref#work/}" >> "$GITHUB_OUTPUT"

      - name: Check out trusted controller code
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out reviewed head as untrusted data
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted validation dependency
        if: steps.pr.outputs.eligible == 'true'
        run: python -m pip install --disable-pip-version-check -r trusted/requirements-dev.txt

      - name: Verify two-round self-review and exact scope with trusted code
        if: steps.pr.outputs.eligible == 'true'
        env:
          TASK_ID: ${{ steps.pr.outputs.task_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python trusted/scripts/validate_autonomy.py \
            --root pr-head \
            --receipt "review/self/$TASK_ID.json" \
            --task-id "$TASK_ID" \
            --pr-number "$PR_NUMBER" \
            --require-automerge-eligible
          python trusted/scripts/validate_pr_scope.py \
            --root pr-head \
            --task-id "$TASK_ID" \
            --pr-number "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Squash-merge exact reviewed head
        if: steps.pr.outputs.eligible == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          TASK_ID: ${{ steps.pr.outputs.task_id }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="[task] $TASK_ID" > /tmp/merge.json
          jq -e '.merged == true' /tmp/merge.json

      - name: Dispatch post-merge finalization
        if: steps.pr.outputs.eligible == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/merged-pr.json
          merge_sha="$(jq -r '.merge_commit_sha // empty' /tmp/merged-pr.json)"
          merged_at="$(jq -r '.merged_at // empty' /tmp/merged-pr.json)"
          head_ref="$(jq -r '.head.ref // empty' /tmp/merged-pr.json)"
          test -n "$merge_sha"
          test -n "$merged_at"
          [[ "$head_ref" == work/task_* ]]
          (
            cd trusted
            gh workflow run finalize-task-merge.yml \
              --ref main \
              -f pr_number="$PR_NUMBER" \
              -f merge_sha="$merge_sha" \
              -f merged_at="$merged_at" \
              -f head_ref="$head_ref"
          )

      - name: Best-effort branch cleanup
        if: steps.pr.outputs.eligible == 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" || \
            echo "::warning::Branch cleanup deferred to repository reconciliation."
