name: Bootstrap autonomous runtime

on:
  push:
    branches:
      - fix/canonicalization-and-queue-integrity
    paths:
      - ".github/workflows/autonomy-bootstrap.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/canonicalization-and-queue-integrity
          fetch-depth: 0

      - name: Generate autonomy contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config schemas scripts docs/architecture review/self queue/issues cleanup/branches tests .github/workflows

          cat > config/autonomy.json <<'JSON'
          {
            "schema_version": 1,
            "mode": "operator_triggered_self_sustaining",
            "timezone": "Europe/Copenhagen",
            "activation_not_before": "2026-08-05T06:30:00Z",
            "daily_cycle": {
              "discovery_due_local_hour": 6,
              "snapshot_due_local_hour": 7,
              "window_minutes": 1440,
              "shard_count": 10,
              "region": "ukraine-war",
              "maximum_open_backlog": 24
            },
            "self_review": {
              "required_rounds": 2,
              "rounds_must_be_separate": true,
              "receipt_root": "review/self"
            },
            "merge_controller": {
              "enabled": true,
              "strategy": "squash",
              "implementation": "github_actions",
              "required_workflow": "Validate repository contracts",
              "eligible_head_prefix": "work/task_",
              "excluded_title_prefixes": ["[hardening]", "[bootstrap]"],
              "worker_direct_merge_allowed": false,
              "administrative_same_identity_controller_allowed": true
            },
            "branch_cleanup": {
              "owner": "merge_controller",
              "workers_must_not_attempt_connector_deletion": true,
              "failure_is_non_blocking": true
            },
            "reports": {
              "daily": "automatic",
              "weekly": "on_demand",
              "monthly": "on_demand"
            }
          }
          JSON

          cat > schemas/autonomy.schema.json <<'JSON'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://war-reporter.invalid/schemas/autonomy.schema.json",
            "title": "Autonomous runtime configuration",
            "type": "object",
            "additionalProperties": false,
            "required": ["schema_version", "mode", "timezone", "activation_not_before", "daily_cycle", "self_review", "merge_controller", "branch_cleanup", "reports"],
            "properties": {
              "schema_version": {"const": 1},
              "mode": {"const": "operator_triggered_self_sustaining"},
              "timezone": {"type": "string", "minLength": 1},
              "activation_not_before": {"type": "string", "format": "date-time"},
              "daily_cycle": {
                "type": "object",
                "additionalProperties": false,
                "required": ["discovery_due_local_hour", "snapshot_due_local_hour", "window_minutes", "shard_count", "region", "maximum_open_backlog"],
                "properties": {
                  "discovery_due_local_hour": {"type": "integer", "minimum": 0, "maximum": 23},
                  "snapshot_due_local_hour": {"type": "integer", "minimum": 0, "maximum": 23},
                  "window_minutes": {"type": "integer", "minimum": 60},
                  "shard_count": {"type": "integer", "minimum": 1, "maximum": 50},
                  "region": {"type": "string", "minLength": 1},
                  "maximum_open_backlog": {"type": "integer", "minimum": 1}
                }
              },
              "self_review": {
                "type": "object",
                "additionalProperties": false,
                "required": ["required_rounds", "rounds_must_be_separate", "receipt_root"],
                "properties": {
                  "required_rounds": {"const": 2},
                  "rounds_must_be_separate": {"const": true},
                  "receipt_root": {"const": "review/self"}
                }
              },
              "merge_controller": {
                "type": "object",
                "additionalProperties": false,
                "required": ["enabled", "strategy", "implementation", "required_workflow", "eligible_head_prefix", "excluded_title_prefixes", "worker_direct_merge_allowed", "administrative_same_identity_controller_allowed"],
                "properties": {
                  "enabled": {"const": true},
                  "strategy": {"const": "squash"},
                  "implementation": {"const": "github_actions"},
                  "required_workflow": {"type": "string", "minLength": 1},
                  "eligible_head_prefix": {"const": "work/task_"},
                  "excluded_title_prefixes": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}, "uniqueItems": true},
                  "worker_direct_merge_allowed": {"const": false},
                  "administrative_same_identity_controller_allowed": {"const": true}
                }
              },
              "branch_cleanup": {
                "type": "object",
                "additionalProperties": false,
                "required": ["owner", "workers_must_not_attempt_connector_deletion", "failure_is_non_blocking"],
                "properties": {
                  "owner": {"const": "merge_controller"},
                  "workers_must_not_attempt_connector_deletion": {"const": true},
                  "failure_is_non_blocking": {"const": true}
                }
              },
              "reports": {
                "type": "object",
                "additionalProperties": false,
                "required": ["daily", "weekly", "monthly"],
                "properties": {
                  "daily": {"const": "automatic"},
                  "weekly": {"const": "on_demand"},
                  "monthly": {"const": "on_demand"}
                }
              }
            }
          }
          JSON

          cat > schemas/self-review.schema.json <<'JSON'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://war-reporter.invalid/schemas/self-review.schema.json",
            "title": "Two-round self-review receipt",
            "type": "object",
            "additionalProperties": false,
            "required": ["pr_number", "rounds", "exceptional_condition"],
            "properties": {
              "task_id": {"type": "string", "pattern": "^task_[a-z0-9][a-z0-9_-]*$"},
              "pr_number": {"type": "integer", "minimum": 1},
              "rounds": {
                "type": "array",
                "minItems": 2,
                "maxItems": 2,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["round", "reviewed_at", "checks", "findings", "outcome"],
                  "properties": {
                    "round": {"type": "integer", "minimum": 1, "maximum": 2},
                    "reviewed_at": {"type": "string", "format": "date-time"},
                    "checks": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}, "uniqueItems": true},
                    "findings": {"type": "array", "items": {"type": "string", "minLength": 1}, "uniqueItems": true},
                    "outcome": {"enum": ["pass", "fail"]}
                  }
                }
              },
              "exceptional_condition": {"type": "boolean"},
              "exceptional_reason": {"type": "string", "minLength": 1}
            },
            "allOf": [
              {
                "if": {"properties": {"exceptional_condition": {"const": true}}, "required": ["exceptional_condition"]},
                "then": {"required": ["exceptional_reason"]}
              }
            ]
          }
          JSON

          cat > scripts/reconcile_queue.py <<'PY'
          #!/usr/bin/env python3
          """Create due discovery/report work and promote dependency-complete tasks."""
          from __future__ import annotations

          import argparse
          import json
          import sys
          from datetime import UTC, date, datetime, time, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          try:
              from .bootstrap_pilot import build_tasks
              from .worker_queue import REPOSITORY_ROOT, index_tasks, role_for_task
          except ImportError:
              from bootstrap_pilot import build_tasks
              from worker_queue import REPOSITORY_ROOT, index_tasks, role_for_task

          TERMINAL = {"merged", "rejected", "cancelled", "duplicate"}
          DISCOVERY_TYPES = {"source_scan", "open_web_discovery"}

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def dump(path: Path, value: object) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def parse(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def utc(value: datetime) -> str:
              return value.astimezone(UTC).isoformat().replace("+00:00", "Z")

          def iter_task_paths(root: Path):
              for path in sorted((root / "tasks").rglob("*.json")) if (root / "tasks").exists() else []:
                  value = load(path)
                  for item in value if isinstance(value, list) else [value]:
                      if isinstance(item, dict) and isinstance(item.get("task_id"), str):
                          yield path, item

          def promote(root: Path, apply: bool) -> list[str]:
              tasks = index_tasks(root / "tasks")
              promoted: list[str] = []
              for task in tasks.values():
                  value = task.value
                  if value.get("state") != "planned":
                      continue
                  dependencies = value.get("depends_on_task_ids", [])
                  if dependencies and all(dep in tasks and tasks[dep].value.get("state") == "merged" for dep in dependencies):
                      promoted.append(task.task_id)
                      if apply:
                          value["state"] = "ready"
                          value["lease"] = None
                          dump(task.path, value)
              return promoted

          def report_task(period: str, start: datetime, end: datetime, dependencies: list[str], now: datetime) -> dict:
              stamp = start.astimezone(UTC).strftime("%Y%m%d")
              task_id = f"task_{stamp}_90_{period}_snapshot"
              output = f"reports/{period}/{start.date().isoformat()}"
              return {
                  "task_id": task_id,
                  "task_type": "daily_report" if period == "daily" else ("weekly_report" if period == "weekly" else "snapshot_report"),
                  "role": role_for_task("daily_report" if period == "daily" else ("weekly_report" if period == "weekly" else "snapshot_report")),
                  "state": "planned" if dependencies else "ready",
                  "priority": 75,
                  "created_at": utc(now),
                  "parent_issue": None,
                  "issue_number": None,
                  "depends_on_task_ids": dependencies,
                  "window": {"from": utc(start), "to": utc(end)},
                  "scope": {"source_ids": [], "source_groups": [], "regions": ["ukraine-war"], "topics": [f"{period}_snapshot"], "content_types": ["report"]},
                  "exclusions": ["No unsupported truth upgrade", "No precise operational coordinates", "No duplicate publications as independent corroboration"],
                  "allowed_output_paths": [f"{output}/**", f"tasks/**/{task_id}.json", f"review/self/{task_id}.json"],
                  "definition_of_done": ["All eligible discovery shards for the period are terminal", "Snapshot preserves source lineage and uncertainty", "Repository validation passes", "Two self-review rounds are recorded before merge"],
                  "idempotency_key": f"report:{period}:{start.date().isoformat()}:{end.date().isoformat()}",
                  "lease": None
              }

          def descriptor(task: dict) -> dict:
              return {
                  "schema_version": 1,
                  "task_id": task["task_id"],
                  "title": f"[task] {task['task_id']}",
                  "body": "Autonomously generated queue task.\n\n"
                          f"Task manifest: `tasks/**/{task['task_id']}.json`\n"
                          f"Deterministic branch: `work/{task['task_id']}`\n\n"
                          "A worker should claim this task through the repository lease protocol, complete two self-review rounds, and leave merge/branch cleanup to the controller.",
                  "issue_number": None
              }

          def existing_keys(root: Path) -> set[str]:
              return {str(item.get("idempotency_key")) for _, item in iter_task_paths(root) if item.get("idempotency_key")}

          def unresolved_count(root: Path) -> int:
              return sum(1 for _, item in iter_task_paths(root) if item.get("state") not in TERMINAL)

          def write_task(root: Path, task: dict) -> None:
              day = task["window"]["from"][:10].replace("-", "/")
              dump(root / "tasks" / day / f"{task['task_id']}.json", task)
              dump(root / "queue" / "issues" / f"{task['task_id']}.json", descriptor(task))

          def daily_plan(root: Path, now: datetime, apply: bool) -> list[str]:
              config = load(root / "config" / "autonomy.json")
              local = now.astimezone(ZoneInfo(config["timezone"]))
              due_hour = int(config["daily_cycle"]["discovery_due_local_hour"])
              if local.hour < due_hour:
                  return []
              target = local.date() - timedelta(days=1)
              start = datetime.combine(target, time.min, tzinfo=UTC)
              end = start + timedelta(days=1)
              key = f"report:daily:{target.isoformat()}:{end.date().isoformat()}"
              keys = existing_keys(root)
              if key in keys:
                  return []
              backlog = unresolved_count(root)
              if backlog:
                  return []
              if backlog >= int(config["daily_cycle"]["maximum_open_backlog"]):
                  return []
              tasks = build_tasks(target, int(config["daily_cycle"]["shard_count"]), str(config["daily_cycle"]["region"]))
              created: list[str] = []
              for task in tasks:
                  task["state"] = "ready"
                  task["lease"] = None
                  task["created_at"] = utc(now)
                  task["parent_issue"] = None
                  task["issue_number"] = None
                  if apply:
                      write_task(root, task)
                  created.append(task["task_id"])
              report = report_task("daily", start, end, created, now)
              if apply:
                  write_task(root, report)
              created.append(report["task_id"])
              return created

          def on_demand_plan(root: Path, period: str, days: int, now: datetime, apply: bool) -> list[str]:
              if period not in {"weekly", "monthly"}:
                  return []
              end = datetime.combine(now.astimezone(UTC).date(), time.min, tzinfo=UTC)
              start = end - timedelta(days=days)
              task = report_task(period, start, end, [], now)
              if task["idempotency_key"] in existing_keys(root):
                  return []
              if apply:
                  write_task(root, task)
              return [task["task_id"]]

          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", type=Path, default=REPOSITORY_ROOT)
              parser.add_argument("--apply", action="store_true")
              parser.add_argument("--now")
              parser.add_argument("--period", choices=["daily", "weekly", "monthly"], default="daily")
              parser.add_argument("--days", type=int)
              args = parser.parse_args(argv or sys.argv[1:])
              now = parse(args.now) if args.now else datetime.now(UTC)
              promoted = promote(args.root, args.apply)
              if args.period == "daily":
                  created = daily_plan(args.root, now, args.apply)
              else:
                  default_days = 7 if args.period == "weekly" else 30
                  created = on_demand_plan(args.root, args.period, args.days or default_days, now, args.apply)
              print(json.dumps({"apply": args.apply, "promoted": promoted, "created": created}, ensure_ascii=False))
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/reconcile_queue.py

          cat > scripts/publish_queue_issues.py <<'PY'
          #!/usr/bin/env python3
          """Publish deterministic queue issue descriptors and persist issue numbers."""
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def request(method: str, url: str, token: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "war-reporter-autonomy"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          def main() -> int:
              token = os.environ["GITHUB_TOKEN"]
              repository = os.environ["GITHUB_REPOSITORY"]
              base = f"https://api.github.com/repos/{repository}"
              published = []
              for path in sorted((ROOT / "queue" / "issues").glob("task_*.json")):
                  descriptor = json.loads(path.read_text(encoding="utf-8"))
                  if descriptor.get("issue_number"):
                      continue
                  issue = request("POST", f"{base}/issues", token, {"title": descriptor["title"], "body": descriptor["body"]})
                  number = int(issue["number"])
                  descriptor["issue_number"] = number
                  path.write_text(json.dumps(descriptor, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  task_id = descriptor["task_id"]
                  for task_path in (ROOT / "tasks").rglob(f"{task_id}.json"):
                      task = json.loads(task_path.read_text(encoding="utf-8"))
                      task["issue_number"] = number
                      task_path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  published.append({"task_id": task_id, "issue_number": number})
              print(json.dumps({"published": published}, ensure_ascii=False))
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/publish_queue_issues.py

          cat > scripts/validate_autonomy.py <<'PY'
          #!/usr/bin/env python3
          """Validate autonomy configuration and two-round self-review receipts."""
          from __future__ import annotations

          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          ROOT = Path(__file__).resolve().parents[1]

          def parse(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def validate(root: Path = ROOT) -> list[str]:
              errors: list[str] = []
              config = json.loads((root / "config" / "autonomy.json").read_text(encoding="utf-8"))
              schema = json.loads((root / "schemas" / "autonomy.schema.json").read_text(encoding="utf-8"))
              for error in Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(config):
                  errors.append(f"config/autonomy.json: {'.'.join(map(str, error.absolute_path)) or '<root>'}: {error.message}")
              review_schema = json.loads((root / "schemas" / "self-review.schema.json").read_text(encoding="utf-8"))
              validator = Draft202012Validator(review_schema, format_checker=FormatChecker())
              receipts: dict[str, dict] = {}
              receipt_root = root / "review" / "self"
              if receipt_root.exists():
                  for path in sorted(receipt_root.glob("*.json")):
                      value = json.loads(path.read_text(encoding="utf-8"))
                      for error in validator.iter_errors(value):
                          errors.append(f"{path.relative_to(root)}: {'.'.join(map(str, error.absolute_path)) or '<root>'}: {error.message}")
                      rounds = value.get("rounds", [])
                      if [item.get("round") for item in rounds] != [1, 2]:
                          errors.append(f"{path.relative_to(root)}: rounds must be exactly [1, 2]")
                      timestamps = [item.get("reviewed_at") for item in rounds]
                      if len(set(timestamps)) != 2:
                          errors.append(f"{path.relative_to(root)}: review rounds must have distinct timestamps")
                      task_id = value.get("task_id")
                      if isinstance(task_id, str):
                          receipts[task_id] = value
              activation = parse(config["activation_not_before"])
              for path in sorted((root / "tasks").rglob("*.json")) if (root / "tasks").exists() else []:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  records = value if isinstance(value, list) else [value]
                  for task in records:
                      created = task.get("created_at")
                      if not isinstance(created, str) or parse(created) < activation:
                          continue
                      if task.get("state") in {"review", "merged"}:
                          receipt = receipts.get(task.get("task_id"))
                          if receipt is None:
                              errors.append(f"{path.relative_to(root)}: autonomous review/merged task lacks two-round receipt")
                          elif any(item.get("outcome") != "pass" for item in receipt.get("rounds", [])):
                              errors.append(f"{path.relative_to(root)}: autonomous task has a failed self-review round")
              return errors

          def main() -> int:
              errors = validate()
              if errors:
                  print("Autonomy validation failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1
              print("Autonomy validation passed.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/validate_autonomy.py

          cat > scripts/prepare_autonomous_merge.py <<'PY'
          #!/usr/bin/env python3
          """Determine whether a successful exact-head CI run may be squash merged."""
          from __future__ import annotations

          import argparse
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def api(path: str):
              req = urllib.request.Request(f"https://api.github.com{path}", headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "war-reporter-autonomy"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          def output(name: str, value: object) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={str(value).lower() if isinstance(value, bool) else value}\n")

          def task_for_pr(number: int):
              for path in sorted((ROOT / "tasks").rglob("*.json")):
                  value = json.loads(path.read_text(encoding="utf-8"))
                  for task in value if isinstance(value, list) else [value]:
                      result = task.get("result")
                      if isinstance(result, dict) and result.get("pr_number") == number:
                          return path, task
              return None, None

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("run_id", type=int)
              parser.add_argument("head_sha")
              args = parser.parse_args()
              repository = os.environ["GITHUB_REPOSITORY"]
              config = json.loads((ROOT / "config" / "autonomy.json").read_text(encoding="utf-8"))
              run = api(f"/repos/{repository}/actions/runs/{args.run_id}")
              if run.get("event") != "pull_request" or run.get("conclusion") != "success" or run.get("head_sha") != args.head_sha:
                  output("eligible", False); return 0
              prs = run.get("pull_requests") or api(f"/repos/{repository}/commits/{args.head_sha}/pulls")
              if not prs:
                  output("eligible", False); return 0
              number = int(prs[0]["number"])
              pr = api(f"/repos/{repository}/pulls/{number}")
              excluded = tuple(config["merge_controller"]["excluded_title_prefixes"])
              if pr.get("state") != "open" or pr.get("draft") or pr.get("head", {}).get("sha") != args.head_sha or pr.get("head", {}).get("repo", {}).get("full_name") != repository or not pr.get("head", {}).get("ref", "").startswith(config["merge_controller"]["eligible_head_prefix"]) or pr.get("title", "").startswith(excluded):
                  output("eligible", False); return 0
              _, task = task_for_pr(number)
              if not task or task.get("state") != "review":
                  output("eligible", False); return 0
              receipt_path = ROOT / "review" / "self" / f"{task['task_id']}.json"
              if not receipt_path.is_file():
                  output("eligible", False); return 0
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              rounds = receipt.get("rounds", [])
              eligible = len(rounds) == 2 and [item.get("round") for item in rounds] == [1, 2] and all(item.get("outcome") == "pass" for item in rounds) and not receipt.get("exceptional_condition")
              output("eligible", eligible)
              if eligible:
                  output("pr_number", number)
                  output("task_id", task["task_id"])
                  output("branch", pr["head"]["ref"])
                  output("head_sha", args.head_sha)
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/prepare_autonomous_merge.py

          cat > scripts/complete_autonomous_merge.py <<'PY'
          #!/usr/bin/env python3
          """Persist terminal task metadata after controller squash merge."""
          from __future__ import annotations

          import argparse
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def now() -> str:
              return datetime.now(UTC).isoformat().replace("+00:00", "Z")

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("pr_number", type=int)
              parser.add_argument("merge_sha")
              parser.add_argument("branch")
              args = parser.parse_args()
              for path in sorted((ROOT / "tasks").rglob("*.json")):
                  value = json.loads(path.read_text(encoding="utf-8"))
                  records = value if isinstance(value, list) else [value]
                  changed = False
                  for task in records:
                      result = task.get("result")
                      if isinstance(result, dict) and result.get("pr_number") == args.pr_number:
                          instant = now()
                          task["state"] = "merged"
                          task["lease"] = None
                          result["merge_sha"] = args.merge_sha
                          result["merged_at"] = instant
                          result["completed_at"] = instant
                          changed = True
                          receipt = {"schema_version": 1, "task_id": task["task_id"], "branch": args.branch, "controller": "github_actions", "attempted_at": instant, "worker_connector_deletion_skipped": True}
                          cleanup = ROOT / "cleanup" / "branches" / f"{task['task_id']}.json"
                          cleanup.parent.mkdir(parents=True, exist_ok=True)
                          cleanup.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  if changed:
                      path.write_text(json.dumps(records if isinstance(value, list) else records[0], ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                      return 0
              raise SystemExit(f"no task found for PR #{args.pr_number}")

          if __name__ == "__main__":
              raise SystemExit(main())
