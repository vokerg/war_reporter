# Payload blobs verified against local Git SHA-1 values.
name: Install autonomous runtime

on:
  push:
    branches:
      - fix/canonicalization-and-queue-integrity
    paths:
      - ".github/workflows/autonomy-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: install-autonomous-runtime
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/canonicalization-and-queue-integrity
          fetch-depth: 0

      - name: Install permanent autonomy files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-workflows
          cp -a .github/workflows/. /tmp/current-workflows/
          cat .autonomy/bootstrap/payload-*.b64 | tr -d '\n' | base64 --decode > /tmp/autonomy-runtime.tar.gz
          tar -xzf /tmp/autonomy-runtime.tar.gz
          rm -rf .autonomy/bootstrap

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run complete validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py
          python scripts/audit_work_refs.py

      - name: Commit permanent runtime files
        run: |
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/current-workflows/. .github/workflows/
          git config user.name "war-reporter-autonomy[bot]"
          git config user.email "war-reporter-autonomy[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            echo "No permanent changes to publish."
            exit 0
          fi
          git commit -m "[autonomy] Install self-sustaining runtime contracts"
          git push origin HEAD:fix/canonicalization-and-queue-integrity
