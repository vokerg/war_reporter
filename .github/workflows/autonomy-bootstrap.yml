          ## Autonomous runtime contract

          On every `копай` invocation, before selecting a task, inspect `config/autonomy.json` and run the logical equivalent of `python scripts/reconcile_queue.py`. Due-work reconciliation may create deterministic task manifests and issue descriptors, but the worker must then claim exactly one eligible task through the normal lease protocol.

          Normal completion requires **two separate self-review rounds**. Record both rounds in `review/self/<task_id>.json`, fix every finding, rerun repository validation, set the task to `review`, and push the exact reviewed head. Do not approve your own PR. When both rounds pass and exact-head CI is green, the autonomous merge controller performs the squash merge and terminal metadata update.

          Treat human intervention as exceptional: unresolved data-integrity ambiguity, a safety boundary, irreconcilable source conflict, missing permissions, failing exact-head CI after repair, or a hardening/bootstrap change. Mark the receipt `exceptional_condition: true` and explain the blocker instead of forcing a merge.

          The GitHub Connector does not provide workers a reliable branch-delete operation. **Do not attempt or retry branch deletion through the connector.** Branch cleanup belongs to the post-merge controller and cleanup failures are non-blocking.

          Daily discovery and the following-morning daily snapshot are automatic obligations. Weekly and monthly snapshots are on-demand only. The operator is not expected to know queue internals; `копай` is the stable entry point.
          ''')

