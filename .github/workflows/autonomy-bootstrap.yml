          # Autonomous runtime

          The normal operator interface is intentionally narrow: point a worker chat at the repository and issue `копай`. Every invocation first checks whether deterministic maintenance work is due, then claims the next eligible task.

          ## Queue reproduction

          `scripts/reconcile_queue.py` is the authoritative idempotent planner. A scheduled GitHub Actions controller runs it twice across the possible Copenhagen UTC offsets; the planner itself applies local-time and idempotency checks, so only one daily wave is created. It generates the ten bounded public-web discovery shards and a dependency-gated daily snapshot task for the preceding UTC day. Companion descriptors are published as GitHub issues. Weekly and monthly snapshots are never generated by the recurring schedule; they require an explicit workflow-dispatch request.

          Queue reproduction stops when unresolved work exists or backlog limits are reached. Planned report tasks are promoted only when every dependency is merged. This preserves backpressure instead of mistaking a fully leased queue for an empty queue.

          ## Two-round self-review and merge

          A worker PR is not merge-admissible until the task is in `review`, the exact PR head has passed `Validate repository contracts`, and `review/self/<task_id>.json` contains two separate passing rounds with no exceptional condition. Workers do not approve their own PRs and do not invoke a merge directly. The GitHub Actions merge controller performs an administrative squash merge and then records the real merge SHA/timestamps in the task manifest.

          This is administrative automation under the configured single-identity trust boundary, not independent review. Hardening/bootstrap PRs and any task declaring an exceptional condition remain human-reviewed exceptions.

          ## Branch cleanup

          ChatGPT workers must not spend time attempting branch deletion through the GitHub Connector. The merge controller owns best-effort REST branch deletion after terminal task metadata is committed. Cleanup failure is recorded but is not a reason to redo completed research.
          MD

