          name: Reconcile autonomous queue

          on:
            schedule:
              - cron: "17 5 * * *"
              - cron: "17 6 * * *"
            workflow_dispatch:
              inputs:
                period:
                  description: Report period; weekly and monthly are explicitly on-demand
                  type: choice
                  options: [daily, weekly, monthly]
                  default: daily
                days:
                  description: Optional on-demand lookback days
                  required: false

          permissions:
            contents: write
            issues: write

          concurrency:
            group: autonomous-queue
            cancel-in-progress: false

          jobs:
            reconcile:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out main
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
