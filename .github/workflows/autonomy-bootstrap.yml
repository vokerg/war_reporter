          name: Autonomous squash merge

          on:
            workflow_run:
              workflows: ["Validate repository contracts"]
              types: [completed]

          permissions:
            actions: read
            contents: write
            pull-requests: write

          concurrency:
            group: autonomous-merge-${{ github.event.workflow_run.head_sha }}
            cancel-in-progress: false

          jobs:
            merge:
              if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out exact validated head
                  uses: actions/checkout@3d3c42e5aac5ba8058258177c33a3a3afcf # v7.0.1
                  with:
                    ref: ${{ github.event.workflow_run.head_sha }}
                    fetch-depth: 0
                - name: Evaluate merge admission
                  id: admission
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                  run: python scripts/prepare_autonomous_merge.py "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.head_sha }}"
                - name: Squash merge admitted worker PR
                  if: steps.admission.outputs.eligible == 'true'
                  id: merge
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                    PR_NUMBER: ${{ steps.admission.outputs.pr_number }}
                    HEAD_SHA: ${{ steps.admission.outputs.head_sha }}
                  run: |
                    python - <<'PY'
                    import json, os, urllib.request
                    repo=os.environ['GITHUB_REPOSITORY']; number=os.environ['PR_NUMBER']; sha=os.environ['HEAD_SHA']
                    payload=json.dumps({'merge_method':'squash','sha':sha}).encode()
                    req=urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{number}/merge', data=payload, method='PUT', headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'war-reporter-autonomy'})
                    with urllib.request.urlopen(req, timeout=30) as response: result=json.loads(response.read().decode())
                    if not result.get('merged'): raise SystemExit(result)
                    with open(os.environ['GITHUB_OUTPUT'],'a') as handle: handle.write(f"merge_sha={result['sha']}\n")
                    PY
                - name: Persist terminal task metadata
                  if: steps.admission.outputs.eligible == 'true'
                  env:
                    PR_NUMBER: ${{ steps.admission.outputs.pr_number }}
                    MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
                    BRANCH: ${{ steps.admission.outputs.branch }}
                  run: |
                    git fetch origin main
                    git checkout -B main origin/main
                    python scripts/complete_autonomous_merge.py "$PR_NUMBER" "$MERGE_SHA" "$BRANCH"
                    git config user.name "war-reporter-merge[bot]"
                    git config user.email "war-reporter-merge[bot]@users.noreply.github.com"
                    git add tasks cleanup
                    git commit -m "[queue] Finalize autonomous merge for PR #$PR_NUMBER"
                    git push origin HEAD:main
                - name: Best-effort work branch cleanup
                  if: steps.admission.outputs.eligible == 'true'
                  continue-on-error: true
                  env:
                    GITHUB_TOKEN: ${{ github.token }}
                    BRANCH: ${{ steps.admission.outputs.branch }}
                  run: |
                    python - <<'PY'
                    import os, urllib.parse, urllib.request
                    repo=os.environ['GITHUB_REPOSITORY']; branch=urllib.parse.quote(os.environ['BRANCH'], safe='')
                    req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}', method='DELETE', headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'war-reporter-autonomy'})
                    try: urllib.request.urlopen(req, timeout=30).read()
                    except Exception as exc: print(f'non-blocking cleanup failure: {exc}')
                    PY
          YAML

