name: Chat control

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    if: >-
      github.repository == 'vokerg/war_reporter' &&
      github.event.issue.number == 155 &&
      github.event.comment.user.login == 'vokerg' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.command.outputs.supported }}
    steps:
      - name: Parse exact command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '(.comment.body | gsub("\r\n"; "\n")) == "/collect yesterday"' \
            "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ignoring unsupported command"
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    needs: gate
    if: needs.gate.outputs.supported == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch production collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/vokerg/war_reporter/actions/workflows/collect.yml/dispatches \
            -f ref=main
