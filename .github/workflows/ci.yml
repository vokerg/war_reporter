name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python -m scripts.validate
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.build_report 2026-08-05
      - run: python -m scripts.build_site
