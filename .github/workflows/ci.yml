name: Final self-review apply and CI
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: final-self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apply-and-test:
    if: github.head_ref == 'refactor/raw-first-osint-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and extract reviewed tree
        run: |
          cat .review/final.part-* | base64 --decode > /tmp/final-review.tar.gz
          echo "20ed9114c84d7fc5e2b863e5ccc53368f65a018035aaf77e37b9872e44851244  /tmp/final-review.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/final-review.tar.gz -C .
          rm -f data/raw/2026/08/05/items.ndjson
          rm -f reports/daily/2026-08-05.md
          rm -rf site .review .github/workflows/apply-review.yml
      - name: Validate reviewed tree
        run: |
          pip install -r requirements.txt
          python -m compileall -q scripts tests
          python -m scripts.validate
          python -m unittest discover -s tests -v
          python -m scripts.build_report 2026-08-05
          python -m scripts.build_site
      - name: Commit reviewed tree
        run: |
          git config user.name "war-reporter-review-bot"
          git config user.email "war-reporter-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete adversarial self-review remediation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
