name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts tests
      - run: python -m scripts.validate
      - run: python -m unittest discover -s tests -v
      - name: Build historical summary-intelligence acceptance days
        run: |
          for day in 2026-08-03 2026-08-05 2026-08-10; do
            python -m scripts.build_report "$day"
          done
      - run: python -m scripts.build_site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 7

  source-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.validate
      - id: collect
        continue-on-error: true
        run: >-
          python -m scripts.collect
          --force
          --lookback-hours 168
          --workers 3
          --sources ua-general-staff-tg,bellingcat-rss,cit-web
      - name: Verify non-empty adapter results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "ua-general-staff-tg",
              "bellingcat-rss",
              "cit-web",
          }
          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          failures = []
          for source_id in sorted(expected):
              row = state.get("per_source", {}).get(source_id, {})
              if row.get("status") != "ok":
                  failures.append(f"{source_id}: status={row.get('status')!r}")
              if int(row.get("fetched", 0)) < 1:
                  failures.append(f"{source_id}: fetched={row.get('fetched', 0)!r}")
          if state.get("status") != "ok":
              failures.append(f"run status={state.get('status')!r}")
          if failures:
              raise SystemExit("; ".join(failures))
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY
      - name: Build live public preview
        run: python -m scripts.build_site
      - uses: actions/upload-artifact@v4
        with:
          name: live-site-preview-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-source-smoke
          path: |
            data/state.json
            data/errors
          if-no-files-found: warn
          retention-days: 7
      - name: Require collector success
        if: steps.collect.outcome != 'success'
        run: exit 1

  x-source-smoke:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.validate
      - name: Bound X smoke pagination
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("config/settings.json")
          settings = json.loads(path.read_text(encoding="utf-8"))
          settings["x_max_pages"] = 1
          path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + "\n")
          PY
          python -m scripts.validate
      - id: collect
        name: Collect X account and recent search
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "X_BEARER_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          python -m scripts.collect \
            --force \
            --lookback-hours 168 \
            --workers 2 \
            --sources ua-general-staff-x,x-discovery-1
      - name: Verify X account and discovery results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/state.json")
          if not path.exists():
              raise SystemExit("X smoke produced no state file")
          state = json.loads(path.read_text(encoding="utf-8"))
          failures = []
          for source_id in ("ua-general-staff-x", "x-discovery-1"):
              row = state.get("per_source", {}).get(source_id, {})
              if row.get("status") != "ok":
                  failures.append(f"{source_id}: status={row.get('status')!r}")
              if int(row.get("fetched", 0)) < 1:
                  failures.append(f"{source_id}: fetched={row.get('fetched', 0)!r}")
          if state.get("status") != "ok":
              failures.append(f"run status={state.get('status')!r}")
          if failures:
              raise SystemExit("; ".join(failures))
          print(json.dumps(state, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-source-smoke
          path: |
            data/state.json
            data/errors
          if-no-files-found: warn
          retention-days: 7
      - name: Require X collector success
        if: steps.collect.outcome != 'success'
        run: exit 1
