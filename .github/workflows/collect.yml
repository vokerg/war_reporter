name: Collect OSINT
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
permissions:
  contents: write
concurrency:
  group: war-reporter-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.validate
      - id: collect
        name: Collect and render
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WAR_REPORTER_WORKERS: "32"
        run: python -m scripts.continuous_loop --once
      - name: Persist successful and partial results
        if: always()
        run: |
          git config user.name "war-reporter-bot"
          git config user.email "war-reporter-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: collect OSINT $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "failed to persist collector results after three attempts" >&2
          exit 1
      - name: Fail visibly on incomplete collection
        if: steps.collect.outcome != 'success'
        run: exit 1
