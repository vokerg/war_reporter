name: Collect OSINT
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
permissions:
  contents: read
concurrency:
  group: war-reporter-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.validate
      - id: collect
        name: Collect and render
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WAR_REPORTER_WORKERS: "32"
        run: python -m scripts.continuous_loop --once
      - id: package
        name: Validate and describe generated artifact
        if: always()
        run: >-
          python -m scripts.package_collection_artifact
          --output collection-artifact-manifest.json
      - id: upload
        name: Upload validated public projection
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: collected-osint-${{ github.run_id }}
          path: |
            data
            reports/daily
            collection-artifact-manifest.json
          if-no-files-found: error
          retention-days: 2
      - name: Fail visibly on incomplete collection
        if: steps.collect.outcome != 'success'
        run: exit 1

  persist:
    needs: collect
    if: ${{ always() && needs.collect.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: collected-osint-${{ github.run_id }}
          path: .
      - name: Verify validated artifact integrity
        run: >-
          python -I scripts/verify_collection_artifact.py
          --root .
          --manifest collection-artifact-manifest.json
      - name: Persist successful and partial results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "war-reporter-bot"
          git config user.email "war-reporter-bot@users.noreply.github.com"
          git add data reports/daily
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: collect OSINT $(date -u +%FT%TZ)"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$auth_header" pull --rebase origin "${GITHUB_REF_NAME}"; then
              if python -m scripts.validate \
                && git -c http.extraheader="$auth_header" push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "failed to persist collector results after three attempts" >&2
          exit 1
