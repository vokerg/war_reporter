name: Finalize merged worker task

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged worker pull request number
        required: true
        type: string
      merge_sha:
        description: Actual squash merge commit SHA
        required: true
        type: string
      merged_at:
        description: Actual pull request merge timestamp
        required: true
        type: string
      head_ref:
        description: Merged worker branch ref
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-merged-worker-task-main
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'work/task_')) ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.head_ref, 'work/task_') &&
       inputs.pr_number != '' &&
       inputs.merge_sha != '' &&
       inputs.merged_at != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FINALIZE_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      FINALIZE_MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_sha || github.event.pull_request.merge_commit_sha }}
      FINALIZE_MERGED_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.merged_at || github.event.pull_request.merged_at }}
      FINALIZE_HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.ref }}
    steps:
      - name: Best-effort worker branch cleanup
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$FINALIZE_HEAD_REF" || \
            echo "::warning::Worker branch cleanup deferred; finalization continues."

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Finalize manifest
        id: finalize
        run: |
          task_id="${FINALIZE_HEAD_REF#work/}"
          python scripts/finalize_merged_task.py \
            --task-id "$task_id" \
            --pr-number "$FINALIZE_PR_NUMBER" \
            --merge-sha "$FINALIZE_MERGE_SHA" \
            --merged-at "$FINALIZE_MERGED_AT" \
            --branch "$FINALIZE_HEAD_REF" | tee /tmp/finalized-task.json
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(python -c 'import json; print(json.load(open("/tmp/finalized-task.json")).get("issue_number") or "")')" >> "$GITHUB_OUTPUT"

      - name: Stop when already finalized
        id: changed
        run: |
          if git diff --quiet; then echo "value=false" >> "$GITHUB_OUTPUT"; else echo "value=true" >> "$GITHUB_OUTPUT"; fi

      - name: Self-review finalization round 1
        if: steps.changed.outputs.value == 'true'
        run: |
          git diff --check
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Self-review finalization round 2
        if: steps.changed.outputs.value == 'true'
        run: |
          git diff --check
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Commit and push trusted finalization to main
        if: steps.changed.outputs.value == 'true'
        env:
          TASK_ID: ${{ steps.finalize.outputs.task_id }}
        run: |
          set -euo pipefail
          git config user.name "war-reporter-finalizer[bot]"
          git config user.email "war-reporter-finalizer[bot]@users.noreply.github.com"
          git add tasks
          git commit -m "[finalize] $TASK_ID"
          git fetch origin main
          git rebase origin/main
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py
          git push origin HEAD:main

      - name: Close task issue
        if: steps.finalize.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.finalize.outputs.issue_number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed || true
