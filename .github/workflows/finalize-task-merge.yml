name: Finalize merged worker task

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: finalize-task-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'work/task_')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Finalize manifest
        id: finalize
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          task_id="${HEAD_REF#work/}"
          python scripts/finalize_merged_task.py \
            --task-id "$task_id" \
            --pr-number "$PR_NUMBER" \
            --merge-sha "$MERGE_SHA" \
            --merged-at "$MERGED_AT" \
            --branch "$HEAD_REF" | tee /tmp/finalized-task.json
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(python -c 'import json; print(json.load(open("/tmp/finalized-task.json")).get("issue_number") or "")')" >> "$GITHUB_OUTPUT"

      - name: Validate finalized state
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Commit finalization to main
        run: |
          if git diff --quiet; then
            echo "Task was already finalized."
            exit 0
          fi
          git config user.name "war-reporter-finalizer[bot]"
          git config user.email "war-reporter-finalizer[bot]@users.noreply.github.com"
          git add tasks
          git commit -m "[finalize] ${{ steps.finalize.outputs.task_id }}"
          git push origin HEAD:main

      - name: Close task issue
        if: steps.finalize.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.finalize.outputs.issue_number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed || true

      - name: Best-effort work branch cleanup
        run: |
          python scripts/audit_work_refs.py --delete-stale || \
            echo "::warning::Work-ref janitor could not delete every stale branch; a later duty sweep will retry."
