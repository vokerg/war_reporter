name: Finalize merged worker task

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-task-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'work/task_')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Best-effort worker branch cleanup
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" || \
            echo "::warning::Worker branch cleanup deferred; finalization continues."

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Finalize manifest
        id: finalize
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          task_id="${HEAD_REF#work/}"
          python scripts/finalize_merged_task.py \
            --task-id "$task_id" \
            --pr-number "$PR_NUMBER" \
            --merge-sha "$MERGE_SHA" \
            --merged-at "$MERGED_AT" \
            --branch "$HEAD_REF" | tee /tmp/finalized-task.json
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(python -c 'import json; print(json.load(open("/tmp/finalized-task.json")).get("issue_number") or "")')" >> "$GITHUB_OUTPUT"

      - name: Stop when already finalized
        id: changed
        run: |
          if git diff --quiet; then echo "value=false" >> "$GITHUB_OUTPUT"; else echo "value=true" >> "$GITHUB_OUTPUT"; fi

      - name: Self-review finalization round 1
        if: steps.changed.outputs.value == 'true'
        run: |
          git diff --check
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Self-review finalization round 2
        if: steps.changed.outputs.value == 'true'
        run: |
          git diff --check
          python scripts/validate_data.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Create and squash-merge finalization PR
        if: steps.changed.outputs.value == 'true'
        env:
          TASK_ID: ${{ steps.finalize.outputs.task_id }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          short="${MERGE_SHA:0:12}"
          branch="control/finalize/$TASK_ID/$short"
          git switch -c "$branch"
          git config user.name "war-reporter-finalizer[bot]"
          git config user.email "war-reporter-finalizer[bot]@users.noreply.github.com"
          git add tasks
          git commit -m "[finalize] $TASK_ID"
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "[finalize] $TASK_ID" --body "Automated control-plane finalization with actual merge SHA and timestamp. Two deterministic self-review rounds passed; no research content is introduced.")"
          pr_number="${pr_url##*/}"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
            -f merge_method=squash \
            -f sha="$head_sha" \
            -f commit_title="[finalize] $TASK_ID" | jq -e '.merged == true'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true

      - name: Close task issue
        if: steps.finalize.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.finalize.outputs.issue_number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed || true
