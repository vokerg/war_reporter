name: Apply canonicalization hardening

on:
  workflow_dispatch:
  push:
    branches:
      - fix/canonicalization-and-queue-integrity
    paths:
      - ".github/workflows/hardening-migrate.yml"
      - ".hardening/bootstrap/**"
      - "config/hardening-gate.json"
      - "config/trust-boundary.json"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: canonicalization-hardening
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/canonicalization-and-queue-integrity
          fetch-depth: 0

      - name: Install hardening framework
        run: |
          cat .hardening/bootstrap/payload-*.b64 | tr -d '\n' | base64 --decode | tar -xz
          rm -rf .hardening/bootstrap

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Apply canonicalization and queue repair
        run: python scripts/harden_repository.py --delete-stale-branches

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated repository state
        run: |
          set +e
          mkdir -p .hardening
          report=.hardening/validation-errors.txt
          : > "$report"
          status=0
          for command in \
            "python scripts/validate_data.py" \
            "python scripts/validate_worker_queue.py" \
            "python scripts/audit_work_refs.py"
          do
            printf '\n$ %s\n' "$command" | tee -a "$report"
            bash -lc "$command" 2>&1 | tee -a "$report"
            code=${PIPESTATUS[0]}
            printf '[exit %s]\n' "$code" | tee -a "$report"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          printf '\n$ git status --short\n' | tee -a "$report"
          git status --short | tee -a "$report"
          if [ -f config/hardening-audit.json ]; then
            printf '\n$ cat config/hardening-audit.json\n' | tee -a "$report"
            cat config/hardening-audit.json | tee -a "$report"
          fi
          exit "$status"

      - name: Commit validation diagnostics
        if: failure()
        run: |
          git config user.name "war-reporter-hardening[bot]"
          git config user.email "war-reporter-hardening[bot]@users.noreply.github.com"
          git add -f .hardening/validation-errors.txt
          git commit -m "[hardening-diagnostic] Capture repository validation failures"
          git push origin HEAD:fix/canonicalization-and-queue-integrity

      - name: Commit generated repairs
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "war-reporter-hardening[bot]"
          git config user.email "war-reporter-hardening[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[hardening-generated] Canonicalize repository records and queue state"
          git push origin HEAD:fix/canonicalization-and-queue-integrity
