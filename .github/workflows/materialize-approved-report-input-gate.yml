name: Materialize approved report input gate

on:
  push:
    branches: [fix/approved-report-input-gate]

permissions:
  contents: write

concurrency:
  group: materialize-approved-report-input-gate
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/approved-report-input-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize exact tested files
        run: |
          cat .patch-staging/reconcile.part* > scripts/reconcile_repository.py
          cp .patch-staging/task-manifest.schema.json schemas/task-manifest.schema.json
          cp .patch-staging/test_reconcile_overlap.py tests/test_reconcile_overlap.py
          cat .patch-staging/test_reconcile_report_inputs.part* > tests/test_reconcile_report_inputs.py
          cp .patch-staging/report-editor.agent.md .github/agents/report-editor.agent.md
          python .patch-staging/patch-test-autonomy.py
          printf '%s  %s\n' \
            adae82ccf2360c6fcf1f3463061fed927cff1b35a71ac91600819d70c2f6b697 scripts/reconcile_repository.py \
            73be82a0d93ce70d26e89235a5316629c51129a51895d95712b47df9eac9731c schemas/task-manifest.schema.json \
            d9e6a1f4bdacc8179b46c16ecfebb12cb7141f8e5512f473837ff58c5f1f18cd tests/test_reconcile_overlap.py \
            2038ef038729d8067262374e7f7c4b0761dd9d59dab9b818013099fcd790620a tests/test_reconcile_report_inputs.py \
            0cdf58d615673b05baab946315f68a30a9fb9eb6d98f12715a07520ac24ee9fa .github/agents/report-editor.agent.md | sha256sum --check
          git diff --check

      - name: Validate repository
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m py_compile scripts/reconcile_repository.py
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_queue_references.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py

      - name: Commit final patch and remove staging
        run: |
          rm -rf .patch-staging .github/workflows/materialize-approved-report-input-gate.yml
          git add -A
          git config user.name "war-reporter-maintenance[bot]"
          git config user.email "war-reporter-maintenance[bot]@users.noreply.github.com"
          git commit -m "Gate daily reports on approved frozen inputs"
          git push origin HEAD:fix/approved-report-input-gate
