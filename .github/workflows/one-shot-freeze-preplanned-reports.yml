name: One-shot freeze preplanned reports

on:
  push:
    branches:
      - fix/freeze-preplanned-report-inputs

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/freeze-preplanned-report-inputs
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/one_shot_freeze_preplanned_reports.py

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run complete validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_queue_references.py
          python scripts/validate_worker_queue.py
          python scripts/validate_autonomy.py
          python scripts/continuous_loop.py --now 2026-08-05T18:00:00Z --open-worker-prs 0 --active-work-branches 0 --exceptional-prs 0 | tee /tmp/loop-result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/loop-result.json', encoding='utf-8'))
          assert result['action'] == 'claim', result
          assert result['task']['task_id'] == 'task_backfill_20260804_extract_official', result
          assert result['queue']['human_gate_task_ids'] == [], result
          PY

      - name: Commit validated repair
        run: |
          git config user.name "vokerg"
          git config user.email "vokerg@gmail.com"
          git add -A
          git commit -m "Freeze report inputs before task promotion"
          git push origin HEAD:fix/freeze-preplanned-report-inputs
