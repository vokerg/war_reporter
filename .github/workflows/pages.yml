name: Deploy Pages
on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "data/errors/**"
      - "data/state.json"
      - "reports/**"
      - "config/settings.json"
      - "config/sources.json"
      - "requirements.txt"
      - "scripts/common.py"
      - "scripts/build_report.py"
      - "scripts/build_site.py"
      - "scripts/html_safety.py"
      - "scripts/public_status.py"
      - "SAFETY.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.validate
      - run: python -m scripts.build_site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
