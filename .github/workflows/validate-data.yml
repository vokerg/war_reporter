name: Validate repository contracts

on:
  pull_request:
    paths:
      - ".github/**"
      - "catalogs/**"
      - "config/**"
      - "data/**"
      - "docs/**"
      - "maps/**"
      - "queue/**"
      - "raw-manifests/**"
      - "reports/**"
      - "review/**"
      - "schemas/**"
      - "scripts/**"
      - "tasks/**"
      - "tests/**"
      - "AGENTS.md"
      - "CHATGPT_PROJECT.md"
      - "METHODOLOGY.md"
      - "SECURITY_AND_SAFETY.md"
      - "CORRECTIONS.md"
      - "requirements-dev.txt"
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate GitHub repository metadata
        run: python scripts/validate_repository_metadata.py

      - name: Validate canonical source watchlist
        run: |
          python scripts/validate_source_watchlist.py
          python scripts/assign_source_watchlist.py --check
          python scripts/validate_source_scan_coverage.py

      - name: Validate repository records and raw manifests
        run: python scripts/validate_data.py

      - name: Validate daily report input eligibility
        run: python scripts/validate_report_input_eligibility.py

      - name: Validate task and proposal scope references
        run: python scripts/validate_queue_references.py

      - name: Validate queue and trust boundary
        run: python scripts/validate_worker_queue.py

      - name: Validate autonomous runtime, self-review, and proposals
        run: python scripts/validate_autonomy.py

      - name: Audit live work refs without blocking on cleanup debt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_work_refs.py
